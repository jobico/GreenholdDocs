# Dependency updates for the docs site.
# Security updates: one pull request per advisory, as soon as GitHub knows about it.
#   The "Dependabot security updates" workflow approves, merges and redeploys them when the build passes.
# Other updates: once a week, grouped into one pull request per ecosystem, merged by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    # Major versions are updated by hand, deliberately.
    #  - mermaid 12: astro-mermaid 2.1.0 allows mermaid 10 and 11 only. Remove this when astro-mermaid supports 12.
    #  - astro and @astrojs/starlight: a major release can change the build and the layout; read the notes first.
    # Minor and patch updates, and security updates of any kind, still arrive.
    ignore:
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
      - dependency-name: astro
        update-types: ["version-update:semver-major"]
      - dependency-name: "@astrojs/starlight"
        update-types: ["version-update:semver-major"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      weekly:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      weekly:
        applies-to: version-updates
        patterns: ["*"]
